name: prizma
services:
  web:
    image: prizma-selfhost:local
    pull_policy: never
    init: true
    env_file:
      - ../../analyzer/vps/.private/worker.env
      - .private/web.env
    environment:
      DATABASE_PATH: /data/prizma.sqlite
      ASSETS_PATH: /app/dist-web
    volumes:
      - ./.private/data:/data
    ports:
      - "127.0.0.1:18080:3000"
    read_only: true
    tmpfs:
      - /tmp:size=32M,noexec,nosuid
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 384m
    memswap_limit: 384m
    cpus: 0.5
    cpu_shares: 256
    pids_limit: 64
    restart: "on-failure:3"
    stop_grace_period: 30s
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8081/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      start_period: 15s
      interval: 15s
      timeout: 5s
      retries: 3
  analyzer:
    image: prizma-selfhost:local
    pull_policy: never
    command: [node, dist-worker/services/analyzer/worker.js]
    init: true
    env_file: ../../analyzer/vps/.private/worker.env
    environment:
      PRIZMA_SITE_URL: http://web:8081
      PRIZMA_SELF_HOSTED: "1"
      MODEL_MANIFEST: /opt/prizma/models/manifest.json
      PORT: "8080"
      REQUIRE_CLAMAV: "0"
    depends_on:
      web: { condition: service_healthy }
    read_only: true
    tmpfs:
      - /tmp:size=64M,noexec,nosuid
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1536m
    memswap_limit: 1536m
    cpus: 1.0
    cpu_shares: 256
    pids_limit: 128
    restart: "on-failure:3"
    stop_grace_period: 30s
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      start_period: 240s
      interval: 30s
      timeout: 5s
      retries: 3
# Reuse only the existing Prizma network; its gateway supplies the exact trusted proxy peer.
networks:
  default:
    name: prizma_default
    external: true

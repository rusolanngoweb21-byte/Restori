# Prizma: separate listener on the verified existing VPS. Existing 80/443 stay intact.
server {
    listen 8443 ssl;
    server_name 185.68.22.22;

    ssl_certificate /etc/letsencrypt/live/185.68.22.22/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/185.68.22.22/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:prizma_tls:1m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;
    server_tokens off;

    if ($http_host != "185.68.22.22:8443") { return 421; }

    client_max_body_size 2850000;
    client_body_timeout 15s;
    client_header_timeout 10s;
    send_timeout 20s;
    keepalive_timeout 5s;
    access_log off;
    error_log /var/log/nginx/error.log warn;

    location = /api/internal { return 404; }
    location ^~ /api/internal/ { return 404; }

    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host "185.68.22.22:8443";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Forwarded "";
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header Connection "";
        proxy_cache off;
        proxy_request_buffering off;
        proxy_max_temp_file_size 0;
        proxy_connect_timeout 3s;
        proxy_send_timeout 20s;
        proxy_read_timeout 30s;
    }
}
